<script>const data=[["Apakah yang dimaksudkan dengan adaptasi sistem tubuh terhadap latihan?", ["Perubahan tubuh hasil program latihan yang sistematik dan berterusan", "Perubahan cuaca semasa pertandingan", "Kesan kecederaan yang berlaku secara tiba-tiba", "Penurunan prestasi akibat tidak berlatih"], 0, "Program latihan sistematik dan berterusan boleh meningkatkan prestasi serta menyebabkan adaptasi sistem tubuh."], ["Antara berikut, sistem tubuh manakah yang menerima adaptasi daripada program latihan?", ["Pencernaan, perkumuhan dan pembiakan sahaja", "Kardiovaskular, otot, respiratori, saraf dan endokrina", "Rangka, limfa dan pencernaan sahaja", "Kulit dan sistem pembiakan sahaja"], 1, "Buku teks menyenaraikan lima sistem: kardiovaskular, otot, respiratori, saraf dan endokrina."], ["Apakah perubahan sistem kardiovaskular ketika aktiviti kecergasan fizikal?", ["Kadar denyutan jantung menurun", "Isipadu strok menjadi sifar", "Kadar denyutan jantung meningkat", "Jantung berhenti mengepam darah"], 2, "Semasa aktiviti fizikal, kadar denyutan jantung meningkat untuk mengepam darah kaya oksigen ke seluruh badan."], ["Isipadu strok merujuk kepada…", ["Jumlah oksigen yang disedut seminit", "Jumlah darah dalam seluruh badan", "Jumlah denyutan jantung dalam satu minit", "Jumlah darah yang keluar dari ventrikel kiri dalam satu denyutan"], 3, "Isipadu strok ialah jumlah darah yang keluar dari ventrikel kiri dalam satu denyutan."], ["Semasa latihan berintensiti tinggi, isipadu strok meningkat dengan peningkatan…", ["Ruang ventrikel kiri", "Saiz alveolus sahaja", "Bilangan neuron sensori", "Kandungan asid laktik dalam darah"], 0, "Buku teks mengaitkan peningkatan isipadu strok dengan peningkatan ruang ventrikel kiri."], ["Keluaran jantung meningkat sejajar dengan perubahan…", ["Tekanan udara dan suhu", "Isipadu strok dan denyutan jantung", "Ketinggian dan berat badan sahaja", "Bilangan sendi dan tulang"], 1, "Keluaran jantung meningkat sejajar dengan isipadu strok dan denyutan jantung."], ["Mengapakah tekanan jantung meningkat ketika latihan berintensiti tinggi?", ["Untuk mengurangkan aliran darah ke otot", "Untuk menghentikan pernafasan", "Jantung perlu bekerja lebih bagi membekalkan oksigen ke seluruh badan", "Untuk mengurangkan keperluan nutrien"], 2, "Jantung didesak bekerja bagi membekalkan oksigen ke seluruh badan semasa latihan intensiti tinggi."], ["Apakah yang berlaku kepada kelikatan darah ketika latihan menurut jadual adaptasi buku teks?", ["Menurun sehingga tiada hemoglobin", "Tidak berubah dalam semua keadaan", "Darah bertukar menjadi air", "Meningkat"], 3, "Jadual adaptasi buku teks menyatakan kelikatan darah meningkat ketika latihan."], ["Apakah sebab yang diberikan dalam buku teks bagi peningkatan kelikatan darah?", ["Darah yang dipam mengandungi oksigen tinggi dan bergabung dengan hemoglobin membentuk oksihemoglobin", "Darah kehilangan semua sel darah merah", "Kandungan oksigen dalam darah menjadi sifar", "Semua plasma darah bertukar menjadi glikogen"], 0, "Oksigen bergabung dengan hemoglobin dalam sel darah merah membentuk oksihemoglobin."], ["Apakah adaptasi sistem respiratori semasa latihan?", ["Pernafasan menjadi cetek dan perlahan", "Pernafasan menjadi lebih dalam dan kadar pernafasan meningkat", "Pernafasan berhenti seketika", "Kadar pernafasan sentiasa kekal sama"], 1, "Keperluan oksigen meningkat, maka pernafasan menjadi lebih dalam dan kadar pernafasan meningkat."], ["Mengapakah kadar pernafasan meningkat semasa latihan?", ["Untuk mengurangkan penghasilan tenaga", "Untuk mengurangkan oksigen dalam darah", "Untuk menampung keperluan oksigen dan nutrien bagi penghasilan tenaga", "Untuk menghentikan pertukaran gas"], 2, "Kadar pernafasan meningkat bagi memenuhi keperluan oksigen dan nutrien untuk penghasilan tenaga."], ["Vasodilation merujuk kepada…", ["Penyempitan pembuluh darah", "Penghentian aliran darah", "Pengurangan saiz jantung", "Pembesaran pembuluh darah"], 3, "Vasodilation ialah pembesaran pembuluh darah yang membantu penghantaran darah kaya oksigen ke otot."], ["Apakah kesan vasodilation semasa latihan?", ["Darah kaya oksigen dapat dihantar segera ke sel tisu organ", "Aliran darah ke otot dihentikan", "Denyutan jantung menjadi sifar", "Oksigen tidak dapat sampai ke otot"], 0, "Pembesaran pembuluh darah membantu darah kaya oksigen dihantar segera ke sel tisu organ."], ["Vasoconstriction bermaksud…", ["Pembesaran pembuluh darah", "Penyempitan pembuluh darah", "Peningkatan isipadu strok", "Peningkatan saiz ventrikel"], 1, "Vasoconstriction ialah penyempitan pembuluh darah."], ["Apakah tujuan pengurangan penghantaran darah ke sistem lain semasa latihan?", ["Meningkatkan aliran darah ke kulit sahaja", "Menghentikan aktiviti otot", "Memberi keutamaan aliran darah kepada otot", "Mengurangkan bekalan oksigen kepada otot"], 2, "Vasoconstriction mengurangkan aliran darah ke bahagian lain bagi memberi keutamaan kepada otot."], ["Mengapakah badan merangsang pengeluaran peluh semasa latihan jangka masa panjang?", ["Meningkatkan suhu badan", "Meningkatkan kelikatan darah", "Menghentikan pergerakan", "Menyejukkan badan dan mengawal suhu"], 3, "Peluh membantu menyejukkan badan dan mengawal suhu akibat pemanasan semasa latihan."], ["Apakah adaptasi sistem otot semasa latihan berdasarkan buku teks?", ["Menggunakan simpanan karbohidrat, protein dan lemak dalam otot sebagai sumber tenaga", "Menghentikan penggunaan ATP", "Mengurangkan semua simpanan tenaga", "Menggantikan otot rangka dengan otot licin"], 0, "Simpanan karbohidrat, protein dan lemak digunakan untuk membentuk ATP."], ["ATP yang dihasilkan melalui penggunaan sumber tenaga otot digunakan untuk…", ["Menghentikan kontraksi otot", "Sintesis komponen sel, kontraksi otot dan pengangkutan nutrien aktif merentasi membran sel", "Mengurangkan fungsi sel", "Menghalang pengangkutan bahan"], 1, "Buku teks menyenaraikan fungsi ATP termasuk sintesis komponen sel, kontraksi otot dan pengangkutan nutrien."], ["Hormon tumbesaran yang meningkat akibat latihan ialah…", ["Insulin", "Glukagon", "GH", "Kalsitonin"], 2, "Rembesan hormon tumbesaran (GH) meningkat hasil latihan."], ["Apakah kesan hormon GH terhadap atlet?", ["Mengurangkan pertumbuhan otot", "Menghentikan pemulihan kecederaan", "Menurunkan kekuatan otot", "Meningkatkan pertumbuhan otot, kekuatan dan prestasi"], 3, "GH membantu pertumbuhan otot, kekuatan, prestasi serta pemulihan tubuh."], ["Rembesan GH dipengaruhi oleh…", ["Intensiti, jangka masa latihan, umur dan jantina", "Warna pakaian dan jenis kasut", "Lokasi stadium sahaja", "Bilangan penonton"], 0, "Buku teks menyatakan intensiti, jangka masa latihan, umur dan jantina mempengaruhi rembesan GH."], ["Apakah kesan peningkatan hormon adrenalina dan noradrenalina?", ["Menurunkan kadar denyutan jantung dan gula darah", "Meningkatkan kadar denyutan jantung, pernafasan dan aras gula darah", "Menghentikan aliran darah ke otot", "Mengurangkan motivasi atlet"], 1, "Hormon ini meningkatkan denyutan jantung, kadar pernafasan dan aras gula darah serta membantu semangat dan motivasi."], ["Prinsip FITT merangkumi…", ["Fokus, intensiti, teknik, taktikal", "Frekuensi, interval, teknik, tenaga", "Frekuensi, intensiti, masa dan jenis latihan", "Fleksibiliti, isipadu, tempoh dan tonus"], 2, "FITT ialah Frequency, Intensity, Time dan Type."], ["Huruf F dalam prinsip FITT merujuk kepada…", ["Fleksibiliti", "Fungsi", "Fasa", "Frekuensi"], 3, "F ialah Frequency atau frekuensi, iaitu kekerapan latihan."], ["Huruf I dalam prinsip FITT merujuk kepada…", ["Intensiti", "Isipadu", "Imbangan", "Interval"], 0, "I ialah Intensity atau intensiti/bebanan latihan."], ["Huruf T pertama selepas I dalam FITT merujuk kepada…", ["Teknik", "Masa", "Taktikal", "Tonus"], 1, "T pertama ialah Time, iaitu masa atau tempoh latihan."], ["Huruf T terakhir dalam FITT merujuk kepada…", ["Tindak balas", "Tahap", "Jenis latihan", "Tekanan"], 2, "T terakhir ialah Type, iaitu jenis latihan."], ["Prinsip FITT diaplikasikan secara progresif untuk…", ["Meningkatkan kebosanan", "Mengelakkan semua aktiviti fizikal", "Mengurangkan kecergasan", "Mengelakkan berlakunya kecederaan"], 3, "Buku teks menyatakan prinsip FITT diaplikasikan secara progresif bagi mengelakkan kecederaan."], ["Bagi atlet berprestasi tinggi, contoh kekerapan sesi latihan seminggu yang dinyatakan ialah…", ["11 hingga 12 sesi", "1 hingga 2 sesi", "3 hingga 4 sesi", "20 hingga 25 sesi"], 0, "Buku teks memberikan contoh 11 hingga 12 sesi seminggu bagi atlet berprestasi tinggi."], ["Intensiti latihan boleh ditentukan melalui pengiraan…", ["Suhu kulit", "Kadar denyutan jantung semasa aktiviti fizikal", "Ketinggian atlet", "Bilangan penonton"], 1, "Tahap bebanan latihan ditentukan melalui kadar denyutan jantung semasa aktiviti fizikal."], ["Petunjuk yang dinyatakan bagi menentukan intensiti latihan ialah kadar nadi latihan mencapai…", ["30–40% maksimum", "50–60% maksimum", "70–80% submaksimum", "100% sepanjang sesi"], 2, "Buku teks menyatakan kadar nadi latihan submaksimum 70% hingga 80%."], ["Tempoh latihan fizikal yang disarankan bagi setiap sesi ialah…", ["5 hingga 10 minit", "10 hingga 15 minit", "60 hingga 90 minit", "Melebihi 20 hingga 30 minit"], 3, "Buku teks menyarankan aktiviti latihan fizikal melebihi 20 hingga 30 minit setiap sesi."], ["Tempoh latihan melebihi 20 hingga 30 minit membolehkan tubuh…", ["Menggunakan tenaga melalui pembakaran lemak", "Menghentikan penggunaan tenaga", "Mengurangkan kadar metabolisme kepada sifar", "Menghentikan penghasilan ATP"], 0, "Tempoh tersebut membolehkan tubuh menggunakan tenaga melalui pembakaran lemak."], ["Mengapakah variasi jenis latihan diaplikasikan?", ["Untuk mengurangkan semua komponen kecergasan", "Untuk meningkatkan semua komponen kecergasan dan mengelakkan kebosanan", "Untuk mengelakkan atlet bergerak", "Untuk menggantikan semua latihan dengan rehat"], 1, "Variasi latihan membantu meningkatkan semua komponen kecergasan fizikal dan mengelakkan kebosanan."], ["Antara berikut, yang manakah contoh jenis latihan yang dinyatakan dalam prinsip FITT?", ["Tidur dan berehat sahaja", "Menonton televisyen", "Berjoging, berbasikal, berenang dan latihan litar", "Berdiri tanpa bergerak"], 2, "Buku teks menyenaraikan berjoging, berjalan kaki, berbasikal, berenang, latihan litar, fartlek, bebanan dan LSD."], ["Antara berikut, yang manakah faktor persekitaran yang mempengaruhi adaptasi tubuh?", ["Warna jersi", "Jenis wisel", "Bilangan pengadil", "Cuaca panas, hujan, altitud tinggi dan pencemaran udara"], 3, "Faktor persekitaran yang dinyatakan termasuk cuaca panas, hujan, altitud tinggi dan jerebu."], ["Mengapakah atlet dan jurulatih perlu peka terhadap faktor persekitaran?", ["Untuk membuat persediaan fizikal dan mental agar proses latihan tidak terganggu", "Untuk menghapuskan keperluan latihan", "Untuk memastikan cuaca sentiasa sama", "Untuk mengurangkan kemahiran atlet"], 0, "Persediaan fizikal dan mental membantu atlet menghadapi persekitaran supaya latihan tidak terganggu."], ["Faktor genetik mempengaruhi prestasi atlet kerana aras maksimum penggunaan oksigen bergantung kepada…", ["Jenis kasut", "Faktor genetik", "Warna kulit", "Tempat latihan sahaja"], 1, "Buku teks menyatakan aras maksimum penggunaan oksigen bergantung kepada faktor genetik."], ["Menurut Bouchard et al. (1992), faktor genetik memberikan varian antara berapa peratus hingga berapa peratus pada nilai maksimum penggunaan oksigen?", ["5–10%", "10–20%", "25–50%", "70–90%"], 2, "Buku teks menyatakan variasi 25% hingga 50%."], ["Tiga jenis somatotaip ialah…", ["Kurus, sederhana dan gemuk", "Tinggi, rendah dan sederhana", "Kuat, pantas dan tangkas", "Endomorf, mesomorf dan ektomorf"], 3, "Tiga jenis somatotaip yang dinyatakan ialah endomorf, mesomorf dan ektomorf."], ["Ciri fizikal endomorf yang tepat ialah…", ["Badan berisi, pendek dan gempal serta mudah menambah lemak", "Kurus dan rangka badan kecil", "Berbadan tegap dan kuat secara semula jadi", "Dada rata dan kadar metabolisme tinggi"], 0, "Endomorf lazimnya berbadan berisi, pendek dan gempal serta mudah menambah lemak."], ["Antara sukan dominan bagi somatotaip endomorf ialah…", ["Lompat tinggi dan lompat jauh", "Sumo, judo, baling tukul besi dan lontar peluru", "Larian pecut 100 meter dan renang", "Maraton dan merentas desa sahaja"], 1, "Buku teks memadankan endomorf dengan sumo, judo, baling tukul besi dan lontar peluru."], ["Ciri fizikal mesomorf ialah…", ["Kurus dan rangka kecil", "Pendek dan gempal", "Kerangka bersegi empat, tegap dan kuat secara semula jadi", "Dada rata dan bahu kecil"], 2, "Mesomorf mempunyai kerangka bersegi empat, badan tegap dan kuat secara semula jadi."], ["Sukan yang disenaraikan bagi somatotaip mesomorf ialah…", ["Sumo dan judo sahaja", "Lompat tinggi dan lompat bergalah", "Maraton dan lumba jalan kaki", "Bola sepak, pecut 100 meter, berbasikal dan renang"], 3, "Sukan dominan mesomorf yang disenaraikan ialah bola sepak, larian pecut 100 meter, berbasikal dan renang."], ["Ciri fizikal ektomorf ialah…", ["Kurus, rangka badan kecil dan kadar metabolisme tinggi", "Badan berisi dan mudah menambah lemak", "Berdada bidang dan berotot besar", "Pendek dan gempal"], 0, "Ektomorf lazimnya kurus, rangka kecil dan mempunyai kadar metabolisme tinggi."], ["Sukan yang dikaitkan dengan somatotaip ektomorf ialah…", ["Sumo, judo dan lontar peluru", "Lompat tinggi, lompat jauh, lompat kijang dan lompat bergalah", "Bola sepak, renang dan berbasikal", "Baling tukul besi dan gusti"], 1, "Buku teks menyenaraikan acara lompatan sebagai sukan dominan ektomorf."], ["Faktor genetik turut mempengaruhi komposisi nisbah…", ["Tulang panjang dan tulang pendek", "Otot kardium dan otot licin", "Fiber otot sentak cepat dan sentak lambat", "Darah arteri dan vena"], 2, "Genetik mempengaruhi nisbah fiber otot sentak cepat dan sentak lambat."], ["Atlet yang mempunyai tahap kecergasan tinggi boleh mengalami…", ["Adaptasi latihan yang lebih rendah sahaja", "Tiada perubahan prestasi", "Kecederaan secara automatik", "Adaptas
